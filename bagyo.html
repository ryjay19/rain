<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open me!</title>
    <style>
        body {
            text-align: center;
            font-family: sans-serif;
            background-color: #eff6ff;
            margin: 0;
            overflow-x: hidden;
        }

        .header {
            width: 100vw;
            text-align: center;
            margin: 0;
            font-size: 25px;
            background-color: #e8e0ff;
            padding: 16px 0;
            border-bottom: 2px solid #8064b5;
            position: fixed;
            top: 0;
            left: 0;
            font-family: 'lucida handwriting', cursive;
            z-index: 100;
        }

        .header h1 {
            font-size: 40px;
            margin: 0;
        }

        .nanditoako {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 80px auto 0 auto; 
            display: flex;
            justify-content: center;
        }

        #rain {
            width: 100%;
            height: auto;
            display: block;
            z-index: 1; 
            transform: translate(-10%, 80%);
        }

        .envelope-wrapper {
            position: absolute;
            top: 25%; 
            left: 58%;
            transform: translate(-30%, 200%) rotate(5deg); 
            z-index: 2;
        }

        .envelope {
            width: 180px;
            height: 90px;
            background-color: #c9b6f2;
            box-shadow: 0 10px 30px rgba(128, 100, 181, 0.3);
            position: relative;
            z-index: 10;
            transition: transform 1s ease;
            transform-style: preserve-3d;
        }

        .envelope-wrapper.open {
            animation: angat 1s forwards ease-in-out;
        }

        @keyframes angat {
            from { transform: translate(-30%, 200%) rotate(5deg); }
            to { transform: translate(-69%, 40%) rotate(0deg); }
        }

        .envelope.open {
            transform: rotateX(30deg) scaleX(1.3) scaleY(1.2);
        }   
        
        .flap {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) rotateX(0deg);
            transform-origin: top center;
            width: 0;
            height: 0;
            border-left: 90px solid transparent;
            border-right: 90px solid transparent;
            border-top: 63px solid #a98bd4;
            z-index: 3;
            transition: transform 1s ease;
            filter: drop-shadow(0 0 1px #8064b5);
        }

        .flap.open {
            transform: translateX(-50%) rotateX(180deg);
        }

        .bottom {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) rotateX(0deg);
            transform-origin: bottom center;
            width: 0;
            height: 0;
            border-left: 90px solid transparent;
            border-right: 90px solid transparent;
            border-bottom: 63px solid #a98bd4;
            margin-top: 27px;
            z-index: 2;
            transition: transform 1s ease;
            filter: drop-shadow(0 0 1px #8064b5);
        }

        .heart > img {
            position: absolute;
            left: 50%;
            top: 15%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            z-index: 4;
            animation: b 3s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes b {
            0%, 8%, 92%, 100% { transform: translate(-50%, -55%) scale(1); }
            10%, 30% { transform: translate(-50%, -55%) scale(1.2); }
            20%, 36% { transform: translate(-50%, -55%) scale(0.9); }
            50% { transform: translate(-50%, -55%) scale(1.1); }
            60%, 80% { transform: translate(-50%, -55%) scale(1); }
        }

        .flowers {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80px;
            height: auto;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: all 1s ease;
            z-index: 5; /* Sits above envelope, behind or beside letter */
            pointer-events: none;
        }

        .flowers.open {
            opacity: 1;
            transform: translate(-50%, -220%) scale(1.2); /* Slides up higher than the letter */
        }

        .letter {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 87%;
            height: 75%;
            background-color: #fff;
            border: 2px solid #a98bd4;
            border-radius: 10px;
            transform: translate(-50%, -50%);
            opacity: 0; 
            transition: all 1s ease;
            z-index: 1; 
            padding: 10px;
            text-align: start;
            overflow-y: auto;
            overflow-x: hidden;
            pointer-events: none;
        }

        .letter.open {
            opacity: 1; 
            z-index: 1000; 
            pointer-events: auto;
        }

        .letter::-webkit-scrollbar { width: 10px; }
        .letter::-webkit-scrollbar-thumb {
            background: #a98bd4;
            border-radius: 10px;
        }
        .letter::-webkit-scrollbar-track { 
            background: #e8e0ff;
        }
        
        .content {
            color: #8064b5;
            width: 101%;
            margin-top: -20px;
            font-size: 10px;
            white-space: pre-line;
            font-family: lucida handwriting, cursive;
        }

        .bottom.open {
            transform: translateX(-50%) rotateX(-180deg);
        }

        .flap.open .heart > img {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .left {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%) rotateY(0deg);
            transform-origin: left center;
            width: 0;
            height: 0;
            border-top: 45px solid transparent;
            border-bottom: 45px solid transparent;
            border-left: 90px solid #a98bd4;
            z-index: 2;
            transition: transform 1s ease;
            filter: drop-shadow(0 0 1px #8064b5);
        }

        .left.open {
            transform: translateY(-50%) rotateY(-180deg);
        }

        .right {
            position: absolute;
            top: 50%;
            right: 0;
            transform: translateY(-50%) rotateY(0deg);
            transform-origin: right center;
            width: 0;
            height: 0;
            border-top: 45px solid transparent;
            border-bottom: 45px solid transparent;
            border-right: 90px solid #a98bd4;
            z-index: 2;
            transition: transform 1s ease;
            filter: drop-shadow(0 0 1px #8064b5);
        }

        .right.open {
            transform: translateY(-50%) rotateY(180deg);
        }
    </style>
</head>
<body spellcheck="false">

    <div class="header">
        <h1>Open me!</h1>
    </div>

    <div class="nanditoako">
        <img src="snowman.png" id="rain" alt="Snowman with bouquet">

        <div class="envelope-wrapper" id="envelopeWrapper">
            <div class="envelope" id="envelope">
                <div class="left"></div>
                <div class="right"></div>
                
                <!-- Flowers hidden inside the envelope -->
                <img src="flowers.png" alt="Flowers" class="flowers" id="flowerImg">

                <div class="flap" id="flap">
                    <div class="heart">
                        <img src="./purple.png" alt="Heart" id="heartBtn">
                    </div>
                </div>
                <div class="bottom"></div>
                <div class="letter" id="letterBox">
                    <div class="content">
                        <p>HAPPY BIRTHDAY!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const left = document.querySelector(".left");
        const right = document.querySelector(".right"); 
        const heartBtn = document.getElementById("heartBtn");
        const flap = document.getElementById("flap");
        const letterBox = document.getElementById("letterBox");
        const envelope = document.getElementById("envelope");
        const envelopeWrapper = document.getElementById("envelopeWrapper");
        const bottom = document.querySelector(".bottom");
        const flowerImg = document.getElementById("flowerImg");

        let clickCount = 0;

        heartBtn.addEventListener("click", () => {
            if (clickCount === 0) {

                envelopeWrapper.classList.add("open");
                clickCount = 1;
            } else if (clickCount === 1) {

                flap.classList.add("open");
                bottom.classList.add("open");  
                left.classList.add("open");    
                right.classList.add("open");   
                letterBox.classList.add("open");
                envelope.classList.add("open");
                flowerImg.classList.add("open");
                clickCount = 2; 
            }
        });
    </script>
</body>
</html>
